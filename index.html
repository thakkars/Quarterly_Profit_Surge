        .dropdown { width: 100%; }

        .dropdown-content label { display: flex; align-items: center; cursor: pointer; font-size: 13px; color: #2d3748; }
        .dropdown-content input { margin-right: 6px; transform: scale(1.1); cursor: pointer; }
        
        .table-container { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; max-height: 70vh;}
        table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        th { background-color: #2b6cb0; color: white; position: sticky; top: 0; font-weight: 600; z-index: 10; cursor: pointer; transition: background 0.2s; user-select: none; }
        th:hover { background-color: #1a365d; }
        .sort-icon { font-size: 12px; margin-left: 5px; opacity: 0.7; }
        tr:hover { background-color: #ebf8ff; }

        .loading { text-align: center; padding: 40px; font-size: 18px; color: #718096; }

        .action-links { margin-top: 6px; display: flex; gap: 5px; }
        .action-links a { text-decoration: none; font-size: 11px; padding: 3px 6px; border-radius: 4px; background: #e2e8f0; color: #2b6cb0; font-weight: bold; transition: 0.2s; border: 1px solid #cbd5e0; }
        .action-links a:hover { background: #cbd5e0; color: #1a365d; border-color: #a0aec0;}

        /* RULES ENGINE MODAL STYLES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: white; width: 95%; max-width: 600px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; max-height: 85vh; overflow: hidden; }
        .modal-header { padding: 15px 20px; background: #1a365d; color: white; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }

        .accordion-toggle.open { transform: rotate(180deg); }

                <button class="btn-done" style="background:#2b6cb0;" onclick="closeExceptionsModal()">Apply Rules & Close</button>

    <script>
        // --- CONFIGURATION ---
        const GITHUB_OWNER = "thakkars"; 
        const GITHUB_REPO = "Quarterly_Profit_Surge"; 
        const WORKFLOW_FILE = "run_screener.yml"; 
        const BRANCH = "main"; 
        const DATA_URL = "https://pub-9afc232687c44eebbb8cae359c7ac460.r2.dev/rawdata.json";
        
        // --- STATE VARIABLES ---
        let rawData = [];
        let currentFilteredData = []; 
        let allColumns = [];
        let visibleColumns = new Set();
        let matrixColumnName = "";
        let sortColumn = "Sr no"; 
        let sortAscending = true;

        // --- INDUSTRY SPECIFIC RULES ---
        let industryRules = {};

        // --- MASTER INDUSTRY LIST ---

            "Gas": ["Gas Transmission/Marketing", "LPG/CNG/PNG/LNG Supplier", "Trading - Gas"],
            "Healthcare Equipment & Supplies": ["Medical Equipment & Supplies"],
            "Healthcare Services": ["Healthcare Research, Analytics & Technology", "Healthcare Service Provider", "Hospital"],
            "Household Products": ["Household Products", "Stationary"],
            "IT - Hardware": ["Computers Hardware & Equipments"],
            "IT - Services": ["IT Enabled Services"],

            "Industrial Manufacturing": ["Industrial Products", "Railway Wagons", "Ship Building & Allied Services"],
            "Industrial Products": ["Abrasives & Bearings", "Aluminium, Copper & Zinc Products", "Cables - Electricals", "Castings & Forgings", "Compressors, Pumps & Diesel Engines", "Electrodes & Refractories", "Glass - Industrial", "Iron & Steel Products", "Other Industrial Products", "Packaging", "Plastic Products - Industrial", "Rubber"],
            "Insurance": ["General Insurance", "Insurance Distributors", "Life Insurance"],

            "Non - Ferrous Metals": ["Aluminium", "Copper", "Precious Metals", "Zinc"],
            "Oil": ["Offshore Support Solution Drilling", "Oil Equipment & Services", "Oil Exploration & Production", "Oil Storage & Transportation"],
            "Other Construction Materials": ["Other Construction Materials"],
            "Other Consumer Services": ["E-Learning", "Education", "Food Storage Facilities", "Other Consumer Services"],
            "Other Utilities": ["Multi Utilities", "Other Utilities", "Waste Management", "Water Supply & Management"],
            "Paper, Forest & Jute Products": ["Forest Products", "Jute & Jute Products", "Paper & Paper Products"],
            "Personal Products": ["Personal Care"],
            "Petroleum Products": ["Lubricants", "Refineries & Marketing"],
            "Pharmaceuticals & Biotechnology": ["Biotechnology", "Pharmaceuticals"],
            "Power": ["Integrated Power Utilities", "Power - Transmission", "Power Distribution", "Power Generation", "Power Trading"],
            "Printing & Publication": ["Printing & Publication"],
            "Realty": ["Real Estate Investment Trusts (REITs)", "Real Estate related services", "Residential, Commercial Projects"],
            "Retailing": ["Distributors", "Diversified Retail", "E-Retail/ E-Commerce", "Internet & Catalogue Retail", "Pharmacy Retail", "Speciality Retail"],
            "Telecom -  Equipment & Accessories": ["Telecom -  Equipment & Accessories"],
            "Telecom - Services": ["Other Telecom Services", "Telecom - Cellular & Fixed line services", "Telecom - Infrastructure"],
            "Textiles & Apparels": ["Garments & Apparels", "Other Textile Products", "Trading - Textile Products"],
            "Transport Infrastructure": ["Airport & Airport services", "Port & Port services", "Road AssetsToll, Annuity, Hybrid-Annuity"],
            "Transport Services": ["Airline", "Logistics Solution Provider", "Road Transport", "Shipping", "Transport Related Services"]
        };

        function getDisplayName(col) {
            if (col === "Company (Page)") return "Company";
            if (col === "date") return "Date";
            return col;
        }

        // ═══════════════════════════════════════════════════════════
        // ADVANCED RULES ENGINE UI
        // ═══════════════════════════════════════════════════════════
        function renderExceptionsTree() {
            const container = document.getElementById("exceptions-tree-container");
            container.innerHTML = "";
            
            Object.keys(MASTER_INDUSTRY_MAP).forEach(group => {
                const subs = MASTER_INDUSTRY_MAP[group];
                const safeId = group.replace(/\W/g, '');
                
                const item = document.createElement("div");
                item.className = "accordion-item";
                
                let html = `
                    <div class="accordion-header" onclick="toggleAccordion('${safeId}')">
                        <span class="accordion-title" id="title-${safeId}">${group}</span>
                        <span class="accordion-toggle" id="arrow-${safeId}">▼</span>
                    </div>
                    <div class="accordion-body" id="body-${safeId}">
                        <div class="group-master-controls">
                            <span style="font-size:12px; font-weight:bold; color:#2d3748;">Quick Apply to Group:</span>
                            <select id="group-action-${safeId}">
                                <option value="">-- Select Rule --</option>
                                <option value="banished_true">🚫 Banish Entire Group</option>
                                <option value="bypassAll_true">🔓 Exempt from ALL Active Filters</option>
                                <option value="bypassWc_true">🔓 Exempt from WC Days Only</option>
                                <option value="clear_all">🧹 Clear All Rules</option>
                            </select>
                            <button onclick="applyGroupAction('${group}', '${safeId}')">Apply</button>
                        </div>
                `;
                
                subs.forEach(sub => {
                    let subId = sub.replace(/\W/g, '');
                    html += `
                        <div class="sub-item">
                            <div class="sub-header" onclick="toggleSubSettings('${subId}')">
                                <span class="sub-title">${sub}</span>
                                <span id="badges-${subId}"></span>
                            </div>
                            <div class="sub-settings" id="settings-${subId}">
                                <label style="color:#c53030; font-weight:bold;">
                                    <input type="checkbox" id="chk-ban-${subId}" onchange="setRule('${sub}', 'banished', this.checked, this)"> 
                                    🚫 Banish Completely (Hide Always)
                                </label>
                                <div class="settings-divider"></div>
                                <div style="font-size:11px; font-weight:bold; color:#718096; margin-bottom:2px;">EXEMPT FROM STRICT FILTERS:</div>
                                <label><input type="checkbox" id="chk-prom-${subId}" onchange="setRule('${sub}', 'bypassPromoter', this.checked, this)"> 🔓 Bypass Promoter Holding ≥ 50%</label>
                                <label><input type="checkbox" id="chk-pledge-${subId}" onchange="setRule('${sub}', 'bypassPledged', this.checked, this)"> 🔓 Bypass Pledged Shares ≤ 10%</label>
                                <label><input type="checkbox" id="chk-wc-${subId}" onchange="setRule('${sub}', 'bypassWc', this.checked, this)"> 🔓 Bypass Working Capital Days</label>
                                <label><input type="checkbox" id="chk-grw-${subId}" onchange="setRule('${sub}', 'bypassGrowth', this.checked, this)"> 🔓 Bypass 70% YoY Profit Surge</label>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
                item.innerHTML = html;
                container.appendChild(item);
            });
            updateTreeVisuals(); 
        }

        function toggleAccordion(safeId) {
            const body = document.getElementById(`body-${safeId}`);
            const arrow = document.getElementById(`arrow-${safeId}`);
            if (body.style.display === "flex") {
                body.style.display = "none";
                arrow.classList.remove("open");
            } else {
                body.style.display = "flex";
                arrow.classList.add("open");
            }
        }

        function toggleSubSettings(subId) {
            const settingsBox = document.getElementById(`settings-${subId}`);
            settingsBox.style.display = (settingsBox.style.display === "flex") ? "none" : "flex";
        }

        // --- RULE VALIDATION & STATE MANAGEMENT ---
        function setRule(sub, key, val, checkboxElement) {
            
            // LOGIC GATE: Ensure Strict Filter is ON before allowing an Override
            if (val === true && key !== 'banished') {
                if (key === 'bypassPromoter' && !document.getElementById('filter-promoter').checked) {
                    alert("PROHIBITED: You cannot exempt this industry from the Promoter Holding rule because that Strict Filter is currently turned OFF on the main dashboard.");
                    if(checkboxElement) checkboxElement.checked = false;
                    return;
                }
                if (key === 'bypassPledged' && !document.getElementById('filter-pledged').checked) {
                    alert("PROHIBITED: You cannot exempt this industry from the Pledged Shares rule because that Strict Filter is currently turned OFF on the main dashboard.");
                    if(checkboxElement) checkboxElement.checked = false;
                    return;
                }
                if (key === 'bypassWc' && !document.getElementById('filter-wc').checked) {
                    alert("PROHIBITED: You cannot exempt this industry from the Working Capital rule because that Strict Filter is currently turned OFF on the main dashboard.");
                    if(checkboxElement) checkboxElement.checked = false;
                    return;
                }
                if (key === 'bypassGrowth' && !document.getElementById('filter-growth').checked) {
                    alert("PROHIBITED: You cannot exempt this industry from the 70% Growth rule because that Strict Filter is currently turned OFF on the main dashboard.");
                    if(checkboxElement) checkboxElement.checked = false;
                    return;
                }
            }

            if (!industryRules[sub]) industryRules[sub] = {};
            industryRules[sub][key] = val;
            
            // Clean up bypasses if banished
            if (key === 'banished' && val === true) {
                industryRules[sub].bypassPromoter = false;
                industryRules[sub].bypassPledged = false;
                industryRules[sub].bypassWc = false;
                industryRules[sub].bypassGrowth = false;
            }
            updateTreeVisuals();
        }

        function applyGroupAction(group, safeId) {
            const select = document.getElementById(`group-action-${safeId}`);
            const action = select.value;
            if (!action) return;

            // Get global strict filter states
            let strictPromoter = document.getElementById('filter-promoter').checked;
            let strictPledged = document.getElementById('filter-pledged').checked;
            let strictWc = document.getElementById('filter-wc').checked;
            let strictGrowth = document.getElementById('filter-growth').checked;
            let skippedSome = false;
            
            MASTER_INDUSTRY_MAP[group].forEach(sub => {
                if (!industryRules[sub]) industryRules[sub] = {};
                
                if (action === 'clear_all') {
                    industryRules[sub] = {};
                } else if (action === 'bypassAll_true') {
                    industryRules[sub].banished = false;
                    // Only apply if the strict filter is active
                    if(strictPromoter) industryRules[sub].bypassPromoter = true; else skippedSome = true;
                    if(strictPledged) industryRules[sub].bypassPledged = true; else skippedSome = true;
                    if(strictWc) industryRules[sub].bypassWc = true; else skippedSome = true;
                    if(strictGrowth) industryRules[sub].bypassGrowth = true; else skippedSome = true;
                } else {
                    let parts = action.split('_');
                    let key = parts[0];
                    let val = parts[1] === 'true';

                    let allowed = true;
                    if (val === true && key !== 'banished') {
                        if (key === 'bypassPromoter' && !strictPromoter) allowed = false;
                        if (key === 'bypassPledged' && !strictPledged) allowed = false;
                        if (key === 'bypassWc' && !strictWc) allowed = false;
                        if (key === 'bypassGrowth' && !strictGrowth) allowed = false;
                    }

                    if (allowed) {
                        industryRules[sub][key] = val;
                        if (key === 'banished' && val === true) {
                            industryRules[sub].bypassPromoter = false;
                            industryRules[sub].bypassPledged = false;
                            industryRules[sub].bypassWc = false;
                            industryRules[sub].bypassGrowth = false;
                        }
                    } else {
                        skippedSome = true;
                    }
                }
            });
            
            if (skippedSome) {
                alert("Notice: Some overrides were skipped because their corresponding Strict Filters are currently turned OFF on the main dashboard.");
            }

            select.value = ""; 
            updateTreeVisuals();
        }

        function updateTreeVisuals() {
            Object.keys(MASTER_INDUSTRY_MAP).forEach(group => {
                let banishedCount = 0;
                let exemptedCount = 0;
                
                MASTER_INDUSTRY_MAP[group].forEach(sub => {
                    let rules = industryRules[sub] || {};
                    let subId = sub.replace(/\W/g, '');
                    
                    if(document.getElementById(`chk-ban-${subId}`)) document.getElementById(`chk-ban-${subId}`).checked = !!rules.banished;
                    if(document.getElementById(`chk-prom-${subId}`)) document.getElementById(`chk-prom-${subId}`).checked = !!rules.bypassPromoter;
                    if(document.getElementById(`chk-pledge-${subId}`)) document.getElementById(`chk-pledge-${subId}`).checked = !!rules.bypassPledged;
                    if(document.getElementById(`chk-wc-${subId}`)) document.getElementById(`chk-wc-${subId}`).checked = !!rules.bypassWc;
                    if(document.getElementById(`chk-grw-${subId}`)) document.getElementById(`chk-grw-${subId}`).checked = !!rules.bypassGrowth;
                    
                    let badgeHtml = '';
                    if (rules.banished) {
                        badgeHtml = '<span class="badge-ban">🚫 Banished</span>';
                        banishedCount++;
                    } else {
                        let bypasses = [];
                        if (rules.bypassPromoter) bypasses.push('Prom');
                        if (rules.bypassPledged) bypasses.push('Pledge');
                        if (rules.bypassWc) bypasses.push('WC');
                        if (rules.bypassGrowth) bypasses.push('Grw');
                        
                        if (bypasses.length > 0) {
                            badgeHtml = `<span class="badge-bypass">🔓 Bypass: ${bypasses.join(', ')}</span>`;
                            exemptedCount++;
                        }
                    }
                    if(document.getElementById(`badges-${subId}`)) {
                        document.getElementById(`badges-${subId}`).innerHTML = badgeHtml;
                    }
                });
                
                let safeId = group.replace(/\W/g, '');
                let titleHtml = `${group} <span style="color:#718096; font-size:12px; font-weight:normal; margin-left:8px;">`;
                if (banishedCount > 0) titleHtml += `<span style="color:#c53030;">(🚫 ${banishedCount})</span> `;
                if (exemptedCount > 0) titleHtml += `<span style="color:#2b6cb0;">(🔓 ${exemptedCount})</span>`;
                titleHtml += `</span>`;
                
                if(document.getElementById(`title-${safeId}`)) {
                    document.getElementById(`title-${safeId}`).innerHTML = titleHtml;
                }
            });
        }

        function openExceptionsModal() {
            document.getElementById("exceptions-modal").style.display = "flex";
            if(document.getElementById("exceptions-tree-container").innerHTML === "") {
                renderExceptionsTree();
            }
        }

        function closeExceptionsModal() {
            document.getElementById("exceptions-modal").style.display = "none";
            applyFiltersAndRender(); 
        }

        // ═══════════════════════════════════════════════════════════
        // UI INTERACTION (DROPDOWN FOR COLUMNS)
        // ═══════════════════════════════════════════════════════════
        function toggleDropdown() {
            const dropdown = document.getElementById("column-dropdown");
            const btn = document.getElementById("dropdown-btn-text");
            dropdown.classList.toggle("show");
            btn.classList.toggle("active");
        }

        function updateDropdownText() {
            document.getElementById("dropdown-btn-text").innerHTML = `👁️ ${visibleColumns.size} Columns Selected <span>▼</span>`;
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content') && !event.target.closest('.modal-overlay')) {
                const dropdown = document.getElementById("column-dropdown");
                const btn = document.getElementById("dropdown-btn-text");
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                    btn.classList.remove('active');
                }
            }
        }

        // ═══════════════════════════════════════════════════════════
        // WORKFLOW TRIGGER LOGIC
        // ═══════════════════════════════════════════════════════════
        async function triggerWorkflow() {
            const btn = document.getElementById('run-btn');
            const statusText = document.getElementById('workflow-status');
            
            let token = localStorage.getItem('gh_token');
            if (!token) {
                token = prompt("Paste your GitHub Personal Access Token (PAT):");
                if (!token) return; 
                localStorage.setItem('gh_token', token.trim());
            }

            try {
                btn.disabled = true;
                statusText.innerHTML = `<span class="spinner"></span> Starting engine...`;

                const dispatchRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ref: BRANCH })
                });

                if (!dispatchRes.ok) throw new Error("API Error");
                
                statusText.innerHTML = `<span class="spinner"></span> Engine spinning up...`;
                setTimeout(() => pollWorkflowStatus(token), 5000);
            } catch (error) {
                statusText.innerHTML = `❌ Error starting`;
                btn.disabled = false;
            }
        }

        async function pollWorkflowStatus(token) {
            const statusText = document.getElementById('workflow-status');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=1`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const data = await res.json();
                
                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const latestRun = data.workflow_runs[0];
                    if (latestRun.status === "completed") {
                        if (latestRun.conclusion === "success") {
                            statusText.innerHTML = `✅ Complete! Fetching fresh data...`;
                            setTimeout(() => {
                                fetchData(); 
                                document.getElementById('run-btn').disabled = false;
                                statusText.innerHTML = `Status: Idle (Fresh Data Loaded)`;
                            }, 3000); 
                        } else {
                            statusText.innerHTML = `❌ Failed.`;
                            document.getElementById('run-btn').disabled = false;
                        }
                        return; 
                    } else {
                        statusText.innerHTML = `<span class="spinner"></span> Engine running...`;
                    }
                }
            } catch (error) { }
            setTimeout(() => pollWorkflowStatus(token), 10000);
        }

        // ═══════════════════════════════════════════════════════════
        // DATA FETCHING & CSV EXPORT
        // ═══════════════════════════════════════════════════════════
        async function fetchData() {
            try {
                const response = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Data not found");
                
                rawData = await response.json();
                
                if(rawData.length > 0) {
                    allColumns = Object.keys(rawData[0]).filter(col => col !== "Name");
                    matrixColumnName = allColumns.find(col => col.includes("(>70%)")) || "";

                    const defaultCols = ["Sr no", "date", "Company (Page)", "Industry", "Promoter Holding", "Pledged %", "WC Days"];
                    if (matrixColumnName) defaultCols.push(matrixColumnName);
                    
                    visibleColumns = new Set(defaultCols.filter(c => allColumns.includes(c)));
                    
                    renderColumnToggles();
                    applyFiltersAndRender();
                }
            } catch (error) {
                document.getElementById('table-body').innerHTML = `<tr><td class="loading" style="color:#e53e3e;" colspan="100%">Raw data not found. Run the backend scraper!</td></tr>`;
            }
        }

        function exportToCSV() {
            if (!currentFilteredData || currentFilteredData.length === 0) {
                alert("No data available to export.");
                return;
            }
            const orderedVisibleCols = allColumns.filter(col => visibleColumns.has(col));
            let csvLines = [];
            
            csvLines.push(orderedVisibleCols.map(c => `"${getDisplayName(c)}"`).join(','));
            
            currentFilteredData.forEach((row, index) => {
                let rowArray = orderedVisibleCols.map(col => {
                    let val = row[col];
                    if (col === "Sr no") val = sortAscending ? (index + 1) : (currentFilteredData.length - index);
                    if (val === null || val === undefined) val = "";
                    let strVal = String(val).replace(/"/g, '""'); 
                    return `"${strVal}"`;
                });
                csvLines.push(rowArray.join(','));
            });
            
            const csvData = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const csvUrl = URL.createObjectURL(csvData);
            const link = document.createElement('a');
            link.href = csvUrl;
            link.download = `Terminal_Export_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ═══════════════════════════════════════════════════════════
        // RENDERING & FILTERING THE TABLE
        // ═══════════════════════════════════════════════════════════
        function renderColumnToggles() {
            const container = document.getElementById('column-dropdown');
            container.innerHTML = '';
            allColumns.forEach(col => {
                const label = document.createElement('label');
                const isChecked = visibleColumns.has(col) ? 'checked' : '';
                label.innerHTML = `<input type="checkbox" value="${col}" ${isChecked} onchange="toggleColumn(this)"> <span>${getDisplayName(col)}</span>`;
                container.appendChild(label);
            });
            updateDropdownText();
        }

        function toggleColumn(checkbox) {
            if (checkbox.checked) visibleColumns.add(checkbox.value);
            else visibleColumns.delete(checkbox.value);
            updateDropdownText();
            applyFiltersAndRender();
        }

        function handleSort(column) {
            if (sortColumn === column) sortAscending = !sortAscending; 
            else { sortColumn = column; sortAscending = true; }
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            const filterPromoter = document.getElementById('filter-promoter').checked;
            const filterPledged = document.getElementById('filter-pledged').checked;
            const filterWc = document.getElementById('filter-wc').checked;
            const filterGrowth = document.getElementById('filter-growth').checked;

            let filteredData = rawData.filter(row => {
                let subIndustry = row["Industry"] || "Not Found";
                let rules = industryRules[subIndustry] || {};
                
                // 1. If industry is completely banished, hide immediately
                if (rules.banished) return false;

                // 2. Process Strict Filters (Applying the Exceptions/Bypasses)
                if (filterPromoter && !rules.bypassPromoter && (parseFloat(row["Promoter Holding"]) || 0) < 50) return false;
                if (filterPledged && !rules.bypassPledged && (parseFloat(row["Pledged %"]) || 0) > 10) return false;
                if (filterWc && !rules.bypassWc && (parseFloat(row["WC Days"]) || 999) > 150) return false;
                if (filterGrowth && !rules.bypassGrowth && matrixColumnName && row[matrixColumnName] !== "Yes") return false;
                
                return true; 
            });

            if (sortColumn && sortColumn !== "Sr no") {
                filteredData.sort((a, b) => {
                    let valA = a[sortColumn]; let valB = b[sortColumn];
                    if (valA === null || valA === "") valA = -999999;
                    if (valB === null || valB === "") valB = -999999;
                    let numA = parseFloat(valA); let numB = parseFloat(valB);
                    if (!isNaN(numA) && !isNaN(numB)) return sortAscending ? numA - numB : numB - numA;
                    let strA = String(valA).toLowerCase(); let strB = String(valB).toLowerCase();
                    if (strA < strB) return sortAscending ? -1 : 1;
                    if (strA > strB) return sortAscending ? 1 : -1;
                    return 0;
                });
            } else if (sortColumn === "Sr no" && !sortAscending) {
                filteredData.reverse();
            }

            currentFilteredData = filteredData; 
            renderTable(filteredData);
        }

        function renderTable(data) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            document.getElementById('row-count').innerText = `Showing ${data.length} of ${rawData.length} stocks`;

            const orderedVisibleCols = allColumns.filter(col => visibleColumns.has(col));

            thead.innerHTML = '<tr>' + orderedVisibleCols.map(col => {
                let sortIcon = '';
                if (sortColumn === col) sortIcon = sortAscending ? '<span class="sort-icon">🔼</span>' : '<span class="sort-icon">🔽</span>';
                return `<th onclick="handleSort('${col}')" title="Click to sort">${getDisplayName(col)}${sortIcon}</th>`;
            }).join('') + '</tr>';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${orderedVisibleCols.length}" class="loading">No stocks match the criteria.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((row, index) => {
                return '<tr>' + orderedVisibleCols.map(col => {
                    if (col === "Sr no") {
                        let displayIndex = sortAscending ? (index + 1) : (data.length - index);
                        return `<td>${displayIndex}</td>`;
                    }
                    if (col === "Company (Page)") {
                        let fullName = row["Company (Page)"];
                        let shortName = encodeURIComponent(row["Name"]); 
                        return `<td>
                            <div style="font-weight: 700; color: #2d3748;">${fullName}</div>
                            <div class="action-links">
                                <a href="https://www.screener.in/company/${shortName}/" target="_blank" title="Open in Screener">🏢 Screener</a>
                                <a href="https://in.tradingview.com/chart/?symbol=NSE%3A${shortName}" target="_blank" title="Open in TradingView">📈 TV</a>
                            </div>
                        </td>`;
                    }
                    let val = row[col];
                    if (val === "Yes") return `<td><span class="badge-yes">Yes</span></td>`;
                    if (val === null || val === 0 || val === "") val = "-";
                    return `<td>${val}</td>`;
                }).join('') + '</tr>';
            }).join('');
        }

        // Add event listeners to Main Dashboard checkboxes to instantly trigger table updates
        document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', applyFiltersAndRender);
        });

        // Initialize App
        fetchData();
        renderExceptionsTree(); 
    </script>
</body>
