<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Research Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #1a365d; margin: 0; }
        .action-panel { display: flex; align-items: center; gap: 10px; background: #edf2f7; padding: 10px 15px; border-radius: 8px; border: 1px solid #cbd5e0; flex-wrap: wrap;}
        #run-btn { background-color: #2b6cb0; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        #run-btn:hover { background-color: #2c5282; }
        #run-btn:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .reset-token-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; transition: 0.2s; opacity: 0.7; }
        .reset-token-btn:hover { opacity: 1; transform: rotate(45deg); }
        #export-btn { background-color: #4a5568; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        #export-btn:hover { background-color: #2d3748; }
        #exceptions-btn { background-color: #e53e3e; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        #exceptions-btn:hover { background-color: #c53030; }
        .mobile-only-btn { display: none; }
        @media (max-width: 768px) {
            .mobile-only-btn { display: inline-block; background-color: #ed8936; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
            .mobile-only-btn:hover { background-color: #dd6b20; }
        }
        #scraper-telemetry { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 220px; }
        #telemetry-headline { font-size: 12px; font-weight: 700; color: #4a5568; letter-spacing: 0.03em; }
        #telemetry-headline.running { color: #2b6cb0; }
        #telemetry-headline.success { color: #276749; }
        #telemetry-headline.error   { color: #c53030; }
        #telemetry-detail { font-size: 11px; color: #718096; font-weight: 500; }
        #telemetry-bar-wrap { width: 100%; height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; display: none; }
        #telemetry-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3182ce, #63b3ed); border-radius: 999px; transition: width 0.6s ease; }
        #telemetry-bar-wrap.active { display: block; }
        .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: #2b6cb0; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .view-toggle-wrapper { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .view-toggle { display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; background: #edf2f7; }
        .view-btn { border: none; padding: 7px 20px; font-size: 13px; cursor: pointer; background: transparent; color: #4a5568; font-weight: 600; transition: 0.2s; }
        .view-btn.active { background: #2b6cb0; color: #fff; border-radius: 999px; }
        .controls { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; padding: 15px; background: #edf2f7; border-radius: 8px; align-items: flex-start; }
        .filter-group { flex: 1; min-width: 250px; }
        .filter-group h3 { margin-top: 0; font-size: 16px; color: #2d3748; margin-bottom: 12px; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px; }
        .checkbox-label { display: block; margin-bottom: 10px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .checkbox-label input[type="checkbox"] { margin-right: 8px; transform: scale(1.2); cursor: pointer;}
        .filter-divider { border: none; border-top: 1px dashed #cbd5e0; margin: 10px 0; }
        .dropdown { width: 100%; }
        .dropdown-btn { background-color: #fff; border: 1px solid #cbd5e0; padding: 10px 15px; border-radius: 6px; font-size: 14px; font-weight: 600; color: #2b6cb0; cursor: pointer; width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .dropdown-btn:hover { background-color: #ebf8ff; border-color: #3182ce; }
        .dropdown-btn.active { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }
        .dropdown-content { display: none; background-color: #fff; border: 1px solid #cbd5e0; border-top: none; border-radius: 0 0 6px 6px; max-height: 300px; overflow-y: auto; }
        .dropdown-content.show { display: flex; flex-direction: column; }
        .col-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f7fafc; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 5; }
        .col-select-all-btn { background: #2b6cb0; color: white; border: none; padding: 4px 11px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .col-select-all-btn:hover { background: #2c5282; }
        .col-select-none-btn { background: #e2e8f0; color: #4a5568; border: none; padding: 4px 11px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .col-select-none-btn:hover { background: #cbd5e0; color: #2d3748; }
        .col-toolbar-hint { font-size: 11px; color: #a0aec0; margin-left: auto; }
        .col-items-list { display: flex; flex-direction: column; padding: 6px 0; }
        .col-item { display: flex; align-items: center; padding: 7px 12px; cursor: grab; user-select: none; gap: 8px; border-radius: 4px; transition: background 0.15s; }
        .col-item:hover { background: #ebf8ff; }
        .col-item.drag-over { background: #bee3f8; border-top: 2px solid #3182ce; }
        .col-item.dragging-item { opacity: 0.4; background: #e2e8f0; }
        .col-drag-handle { color: #a0aec0; font-size: 13px; flex-shrink: 0; cursor: grab; }
        .col-item input[type="checkbox"] { margin: 0; transform: scale(1.1); cursor: pointer; flex-shrink: 0; }
        .col-item-label { font-size: 13px; color: #2d3748; flex: 1; cursor: pointer; }
        .col-item-label.yoy-label { color: #6b46c1; font-style: italic; }
        .col-item-label.surge-label { color: #276749; font-weight: 700; }
        .threshold-input { width: 55px; padding: 2px 5px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 13px; font-weight: 600; color: #2b6cb0; text-align: center; margin: 0 2px; background: #ebf8ff; }
        .threshold-input:focus { outline: none; border-color: #3182ce; background: #fff; }
        .table-container { overflow-x: auto; overflow-y: visible; border: 1px solid #e2e8f0; border-radius: 8px; background: white; cursor: grab; }
        .table-container.dragging { cursor: grabbing !important; user-select: none; }
        .table-container:fullscreen { padding: 15px; max-height: 100vh; overflow: auto; background-color: white; }
        .table-container:-webkit-full-screen { padding: 15px; max-height: 100vh; overflow: auto; background-color: white; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        th { background-color: #2b6cb0; color: white; position: sticky; top: 0; font-weight: 600; z-index: 10; cursor: pointer; transition: background 0.2s; user-select: none; }
        th:hover { background-color: #1a365d; }
        th.yoy-th { background-color: #553c9a; }
        th.yoy-th:hover { background-color: #44337a; }
        th.surge-th { background-color: #276749; }
        th.surge-th:hover { background-color: #1a4731; }
        .sort-icon { font-size: 12px; margin-left: 5px; opacity: 0.7; }
        tr:hover { background-color: #ebf8ff; }
        .badge-yes { background-color: #48bb78; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-peak { background-color: #d69e2e; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .surge-qtr-tag { display: inline-block; background: #c6f6d5; color: #276749; border: 1px solid #9ae6b4; padding: 2px 7px; border-radius: 8px; font-size: 12px; font-weight: 700; margin: 1px 2px; }
        .surge-qtr-tag.current { background: #2b6cb0; color: white; border-color: #1a365d; }
        .yoy-pos { color: #276749; font-weight: 700; }
        .yoy-neg { color: #c53030; font-weight: 700; }
        .yoy-na  { color: #a0aec0; font-size: 12px; }
        .loading { text-align: center; padding: 40px; font-size: 18px; color: #718096; }
        .stats { text-align: right; font-size: 14px; color: #4a5568; margin-bottom: 10px; font-weight: 600; }
        .action-links { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
        .action-links a { text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 4px; background: #e2e8f0; color: #2b6cb0; font-weight: bold; transition: 0.2s; border: 1px solid #cbd5e0; display: inline-block; }
        .action-links a:hover { background: #cbd5e0; color: #1a365d; border-color: #a0aec0;}
        .action-links .note-btn { background: #bee3f8; color: #2b6cb0; border-color: #90cdf4; }
        .action-links .note-btn:hover { background: #90cdf4; color: #1a365d; }
        .action-links .chart-btn { background: #c6f6d5; color: #276749; border-color: #9ae6b4; }
        .action-links .chart-btn:hover { background: #9ae6b4; color: #1a4731; }
        #charts-view { display: none; }
        .charts-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .charts-header h2 { font-size: 15px; color: #2d3748; margin: 0; }
        .charts-count { font-size: 13px; color: #718096; background: #edf2f7; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
        .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-card { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .chart-card-header { padding: 10px 14px; background: #f7fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .chart-card-name { font-weight: 700; font-size: 13px; color: #1a365d; }
        .chart-card-meta { font-size: 11px; color: #718096; }
        .chart-card-links { display: flex; gap: 5px; }
        .chart-card-links a { text-decoration: none; font-size: 10px; padding: 3px 7px; border-radius: 4px; background: #e2e8f0; color: #2b6cb0; font-weight: bold; border: 1px solid #cbd5e0; }
        .chart-card-links a:hover { background: #cbd5e0; }
        .chart-card iframe { display:block; width:100%; height:400px; border:none; }
        .charts-loading { text-align: center; padding: 60px; color: #718096; font-size: 16px; }
        .chat-drawer { position: fixed; top: 0; right: -450px; width: 400px; max-width: 100%; height: 100vh; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.2); transition: right 0.3s ease-in-out; z-index: 2000; display: flex; flex-direction: column; }
        .chat-drawer.open { right: 0; }
        .chat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1999; display: none; backdrop-filter: blur(2px); }
        .chat-overlay.open { display: block; }
        .chat-header { padding: 15px 20px; background: #1a365d; color: white; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { margin: 0; font-size: 16px; }
        .chat-header button { background: none; border: none; color: white; font-size: 24px; cursor: pointer; line-height: 1; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f4f7f9; display: flex; flex-direction: column; gap: 12px; }
        .chat-message { background: white; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .chat-message .author { font-weight: bold; color: #2b6cb0; font-size: 13px; margin-bottom: 5px; }
        .chat-message .text { font-size: 14px; color: #2d3748; line-height: 1.4; white-space: pre-wrap; }
        .chat-message .time { font-size: 11px; color: #a0aec0; margin-top: 6px; text-align: right; }
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #e2e8f0; }
        .chat-input-area input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; }
        .chat-input-area textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; resize: none; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        .chat-input-area button { width: 100%; background: #48bb78; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .chat-input-area button:hover { background: #38a169; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 95%; max-width: 600px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; max-height: 85vh; overflow: hidden; }
        .modal-header { padding: 15px 20px; background: #1a365d; color: white; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .modal-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
        .modal-body { flex: 1; overflow-y: auto; padding: 15px; background: #f4f7f9; }
        .modal-footer { padding: 15px; background: #edf2f7; border-top: 1px solid #cbd5e0; text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .global-overrides-panel { background: #ebf8ff; border: 1px solid #bee3f8; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .global-overrides-panel h4 { margin: 0 0 5px 0; color: #2b6cb0; font-size: 15px; }
        .global-overrides-panel p { font-size: 12px; color: #4a5568; margin-top: 0; margin-bottom: 10px; }
        .modal-filter-divider { border: none; border-top: 1px dashed #bee3f8; margin: 8px 0 10px 0; }
        .global-override-label { display: block; font-size: 13.5px; color: #2d3748; margin-bottom: 8px; cursor: pointer; font-weight: 500; }
        .global-override-label input { margin-right: 8px; transform: scale(1.15); cursor: pointer; }
        .global-override-label.disabled-rule { opacity: 0.4; pointer-events: none; }
        .tree-header-text { font-size: 15px; font-weight: bold; color: #1a365d; margin-bottom: 10px; padding-left: 5px; border-bottom: 2px solid #cbd5e0; padding-bottom: 5px; }
        .accordion-item { border: 1px solid #cbd5e0; border-radius: 6px; margin-bottom: 8px; background: white; overflow: hidden; }
        .accordion-header { display: flex; align-items: center; padding: 12px 15px; cursor: pointer; transition: 0.2s; user-select: none; }
        .accordion-header:hover { background: #edf2f7; }
        .accordion-header input { margin-right: 12px; transform: scale(1.3); cursor: pointer; }
        .accordion-title { flex: 1; font-weight: 600; color: #2d3748; font-size: 14px; }
        .accordion-toggle { color: #718096; font-size: 12px; font-weight: bold; transition: transform 0.2s; }
        .accordion-toggle.open { transform: rotate(180deg); }
        .accordion-body { border-top: 1px solid #cbd5e0; padding: 12px 15px 12px 40px; display: none; flex-direction: column; gap: 10px; background: #fafafa; }
        .accordion-body label { display: flex; align-items: center; cursor: pointer; font-size: 13.5px; color: #4a5568; }
        .accordion-body input { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-area">
        <h1>📈 Equity Research Terminal</h1>
        <div class="action-panel">
            <button id="run-btn" onclick="triggerWorkflow()">▶️ Run Backend Scraper</button>
            <button onclick="resetToken()" class="reset-token-btn" title="Reset GitHub Token">🔄</button>
            <button id="exceptions-btn" onclick="openExceptionsModal()">⚙️ VIP Exceptions</button>
            <button id="export-btn" onclick="exportToCSV()">📥 Export CSV</button>
            <button id="landscape-btn" class="mobile-only-btn" onclick="toggleLandscape()">📱 Flip Table</button>
            <div id="scraper-telemetry">
                <span id="telemetry-headline">Status: Idle</span>
                <span id="telemetry-detail"></span>
                <div id="telemetry-bar-wrap"><div id="telemetry-bar"></div></div>
            </div>
        </div>
    </div>
    <div class="view-toggle-wrapper">
        <div class="view-toggle">
            <button id="btn-view-list" class="view-btn active" onclick="switchView('list')">📋 List</button>
            <button id="btn-view-charts" class="view-btn" onclick="switchView('charts')">📊 Charts</button>
        </div>
    </div>
    <div id="list-section">
        <div class="controls">
            <div class="filter-group">
                <h3>🎯 Strict Filters (Baseline Rules)</h3>
                <label class="checkbox-label"><input type="checkbox" id="filter-current-qtr" onchange="handleMainFilterChange('filter-current-qtr','global-current-qtr','bypassCurrentQtr')"> Current Quarter Surge Only <span id="current-qtr-badge" style="margin-left:6px;background:#2b6cb0;color:white;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:bold;"></span></label>
                <label class="checkbox-label"><input type="checkbox" id="filter-peak-qtr" onchange="handleMainFilterChange('filter-peak-qtr','global-peak-qtr','bypassPeakQtr')"> 🏆 Highest Ever Quarterly Result</label>
                <hr class="filter-divider">
                <label class="checkbox-label"><input type="checkbox" id="filter-growth" onchange="handleMainFilterChange('filter-growth','global-growth','bypassGrowth')"> Latest Qtr. YoY Operating Profit ≥ <input type="number" id="val-growth" value="70" min="1" max="9999" step="1" class="threshold-input" onclick="event.stopPropagation()" oninput="applyFiltersAndRender()">%</label>
                <label class="checkbox-label"><input type="checkbox" id="filter-promoter" onchange="handleMainFilterChange('filter-promoter','global-promoter','bypassPromoter')"> Promoter Holding ≥ <input type="number" id="val-promoter" value="50" min="0" max="100" step="1" class="threshold-input" onclick="event.stopPropagation()" oninput="applyFiltersAndRender()">%</label>
                <label class="checkbox-label"><input type="checkbox" id="filter-pledged" onchange="handleMainFilterChange('filter-pledged','global-pledged','bypassPledged')"> Pledged Shares ≤ <input type="number" id="val-pledged" value="10" min="0" max="100" step="1" class="threshold-input" onclick="event.stopPropagation()" oninput="applyFiltersAndRender()">%</label>
                <label class="checkbox-label"><input type="checkbox" id="filter-wc" onchange="handleMainFilterChange('filter-wc','global-wc','bypassWc')"> Working Capital Days ≤ <input type="number" id="val-wc" value="150" min="0" max="9999" step="1" class="threshold-input" onclick="event.stopPropagation()" oninput="applyFiltersAndRender()"></label>
                <label class="checkbox-label"><input type="checkbox" id="filter-msi" onchange="handleMainFilterChange('filter-msi','global-msi','bypassMsi')"> MSI Price Strength &gt; <input type="number" id="val-msi" value="80" min="0" max="100" step="1" class="threshold-input" onclick="event.stopPropagation()" oninput="applyFiltersAndRender()"></label>
            </div>
            <div class="filter-group" style="flex: 2;">
                <h3>👁️ Column Settings</h3>
                <div class="dropdown">
                    <button onclick="toggleDropdown()" class="dropdown-btn" id="dropdown-btn-text">Select Columns ▼</button>
                    <div id="column-dropdown" class="dropdown-content">
                        <div class="col-toolbar">
                            <button class="col-select-all-btn" onclick="selectAllColumns(event)">Select All</button>
                            <button class="col-select-none-btn" onclick="selectNoneColumns(event)">Deselect All</button>
                            <span class="col-toolbar-hint">☰ Drag to reorder</span>
                        </div>
                        <div class="col-items-list" id="col-items-list"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="stats" id="row-count">Loading...</div>
        <div class="table-container" id="main-table-container">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td class="loading" colspan="100%">Fetching live market data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="charts-view">
        <div class="charts-header">
            <h2>📊 TradingView Charts</h2>
            <span class="charts-count" id="charts-count">0 stocks</span>
        </div>
        <div class="charts-grid" id="charts-grid"></div>
    </div>
</div>

<div class="chat-overlay" id="chat-overlay" onclick="closeChat()"></div>
<div class="chat-drawer" id="chat-drawer">
    <div class="chat-header">
        <h3 id="chat-title">📝 Notes</h3>
        <button onclick="closeChat()">×</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
        <input type="text" id="chat-author" placeholder="Your name..." maxlength=
