<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Research Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light mode base */
            --bg-primary: #fefefe;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f2f2f2;
            --bg-card: #f8f9fa;
            --bg-warm: #f5f5f5;

            /* Vibrant accents */
            --accent-blue: #007bff;
            --accent-teal: #20c997;
            --accent-coral: #dc3545;
            --accent-amber: #ffc107;
            --accent-emerald: #28a745;
            --accent-violet: #6f42c1;
            --text-primary: #343a40;
            --text-secondary: #495057;
            --text-muted: #6c757d;
            --border-subtle: #dee2e6;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            
            /* Radii */
            --radius-md: 12px;
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            background: var(--bg-card);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background: darken(var(--accent-blue), 5%);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .table-wrap {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }

        th {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        tr:hover {
            background: rgba(0, 123, 255, 0.1);
        }

        .badge {
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
        }

        .badge-yes {
            background: var(--accent-emerald);
            color: white;
        }

        .badge-peak {
            background: var(--accent-coral);
            color: white;
        }

        /* Additional styles for chat, modal, etc. */
    </style>
    <base target="_blank">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <h1>Equity Research Terminal</h1>
                <span>Quarterly Profit Surge Screener</span>
            </div>
            <div class="btn-group">
                <button id="run-btn" class="btn btn-primary" onclick="triggerWorkflow()"> 
                    <span>▶</span> Run Scraper 
                </button>
                <button class="btn btn-secondary" onclick="exportToCSV()">📥 Export</button>
            </div>
        </div>
    </header>
    <div class="container">
        <!-- Main Content -->
        <div class="table-wrap">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="100%">
                            <div class="loading-state">Loading data...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Additional Scripts -->
    <script>
        // JavaScript functions and event listeners
    </script>
</body>
</html>
