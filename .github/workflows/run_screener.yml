name: Run Stock Screener

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install Python dependencies
      run: pip install selenium pandas numpy openpyxl google-auth google-auth-httplib2 google-api-python-client gspread

    - name: Download existing files from Google Drive
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        GITHUB_ACTIONS: "true"
      run: python download_from_drive.py

    - name: Run Stock Screener
      env:
        SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
        SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        GITHUB_ACTIONS: "true"
      run: python R01_70__Operating_Profit.py

    - name: Upload Excel files as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screener-results-${{ github.run_number }}
        path: /tmp/screener_data/
        retention-days: 30
```

