name: Run Stock Screener

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install Python dependencies
      run: pip install selenium pandas numpy openpyxl boto3 google-auth google-auth-httplib2 google-api-python-client gspread

    - name: Run Stock Screener
      env:
        SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
        SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME: quarterly-profit-surge
        GITHUB_ACTIONS: "true"
      run: python R01_70__Operating_Profit.py

    - name: Upload Excel files as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screener-results-${{ github.run_number }}
        path: /tmp/screener_data/
        retention-days: 30
```
