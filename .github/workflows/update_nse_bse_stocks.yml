name: Update NSE BSE Stocks Daily

on:
  schedule:
    - cron: '30 12 * * *'   # 6:00 PM IST = 12:30 UTC
  workflow_dispatch:          # manual trigger anytime

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install selenium requests pandas openpyxl boto3

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run update script
        env:
          SCREENER_USERNAME:    ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD:    ${{ secrets.SCREENER_PASSWORD }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        run: python R05_Update_NSE_BSE_Stocks.py
