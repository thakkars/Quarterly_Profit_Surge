name: Update NSE BSE Stocks Daily

on:
  schedule:
    - cron: '30 12 * * *'   # 6:00 PM IST = 12:30 UTC
  workflow_dispatch:          # manual trigger anytime

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install selenium requests pandas openpyxl

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run update script
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          GITHUB_ACTIONS:    "true"
        run: python R05_Update_NSE_BSE_Stocks.py

      - name: Commit and push updated master excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "All NSE BSE Stocks.xlsx" || true
          git commit -m "Auto-update All NSE BSE Stocks master [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped or failed"
